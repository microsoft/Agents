services:
  agent:
    build:
      context: .
      args:
        - PIP_INDEX_URL
    network_mode: "service:sidecar"
    environment:
      HOST: 0.0.0.0
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHTYPE: "${CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHTYPE:?Set sidecar auth type in .env}"
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__ANONYMOUS_ALLOWED: "${CONNECTIONS__SERVICE_CONNECTION__SETTINGS__ANONYMOUS_ALLOWED:?Set anonymous access policy in .env}"
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID: "${CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID:?Set Blueprint client ID in .env}"
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__TENANTID: "${CONNECTIONS__SERVICE_CONNECTION__SETTINGS__TENANTID:?Set Blueprint tenant ID in .env}"
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SIDECAR_BASE_URL: "${CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SIDECAR_BASE_URL:?Set sidecar URL in .env}"
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SERVICE_NAME: "${CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SERVICE_NAME:?Set sidecar service name in .env}"
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__BLUEPRINT_SERVICE_NAME: "${CONNECTIONS__SERVICE_CONNECTION__SETTINGS__BLUEPRINT_SERVICE_NAME:?Set Blueprint service name in .env}"
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SCOPES: "${CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SCOPES:?Set callback scopes in .env}"
      CONNECTIONSMAP__0__SERVICEURL: "${CONNECTIONSMAP__0__SERVICEURL:?Set service URL map in .env}"
      CONNECTIONSMAP__0__CONNECTION: "${CONNECTIONSMAP__0__CONNECTION:?Set connection map in .env}"
    depends_on:
      - sidecar
    security_opt:
      - no-new-privileges:true

  sidecar:
    image: mcr.microsoft.com/entra-sdk/auth-sidecar:1.1.1-azurelinux3.0-distroless
    ports:
      - "127.0.0.1:3978:3978"
    environment:
      ASPNETCORE_URLS: http://+:5000
      AllowedHosts: "*"
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__TenantId: ${BLUEPRINT_TENANT_ID}
      AzureAd__ClientId: ${BLUEPRINT_CLIENT_ID}
      AzureAd__ClientCredentials__0__SourceType: ClientSecret
      AzureAd__ClientCredentials__0__ClientSecret: ${BLUEPRINT_CLIENT_SECRET}
      Sidecar__AllowOverrides__GetAuthorizationHeaderUnauthenticated: "true"
      DownstreamApis__agenticblueprint__Scopes__0: api://AzureAdTokenExchange/.default
      DownstreamApis__agenticblueprint__RequestAppToken: "true"
      DownstreamApis__botframework__BaseUrl: https://api.botframework.com/
      DownstreamApis__botframework__Scopes__0: 5a807f24-c9de-44ee-a3a7-329e88a00ffc/.default
    networks:
      - agent-network
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  agent-network:
    driver: bridge
